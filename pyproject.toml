[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "world-model-agent"
version = "0.1.0"
description = "TextWorld AI Agent with Structured World Model — Competition Track 1"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "textworld>=1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
]
vis = [
    "textworld[vis]",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
